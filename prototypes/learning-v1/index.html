<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小智学堂 · 三键学习原型</title>
<style>
:root{font-family:ui-rounded,"PingFang SC",system-ui,sans-serif;color:#283c38;background:#f4f1e9}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:44px 28px}.eyebrow{font-size:12px;letter-spacing:3px;color:#71817a}h1{font-size:34px;margin:14px 0 10px;letter-spacing:-1px}.intro{color:#71817a;line-height:1.8;max-width:620px}.layout{display:grid;grid-template-columns:1fr 380px;gap:80px;align-items:center;margin-top:36px}.device-zone{display:flex;justify-content:center;background:#e6e9de;border-radius:36px;padding:36px 20px}.device{background:#fdfbf4;padding:22px 20px 18px;border-radius:46px;box-shadow:0 16px 0 #d0d3c7,0 26px 40px #334a3520;border:2px solid #fff;width:284px}.screen{width:240px;height:320px;background:#fff9ec;border-radius:23px;overflow:hidden;position:relative;color:#30413b}.status{height:27px;padding:9px 16px 0;display:flex;justify-content:space-between;font-size:10px;color:#74847a}.view{height:259px;padding:8px 16px 0;display:flex;flex-direction:column;align-items:center;gap:8px}.screen h2{font-size:23px;margin:4px 0 3px}.sub{font-size:12px;color:#7c877c}.hint{height:34px;background:#f0eddf;display:flex;align-items:center;justify-content:center;font-size:11px;color:#64756b}.menu{width:100%;background:#e6eddc;border:3px solid transparent;border-radius:17px;padding:16px 12px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650}.menu.blue{background:#dfeef1}.selected{border-color:#386b50!important}.menu span{font-size:30px}.art{font-size:83px;line-height:1.12;margin:5px 0}.word{font-size:34px;font-weight:750;letter-spacing:.5px}.zh{font-size:17px;color:#6c7f6c}.pill{padding:6px 13px;border-radius:20px;background:#e2ecd8;font-size:12px;color:#43694a}.keys{display:flex;gap:16px;justify-content:center;margin-top:21px}.keys button{border:0;background:#e8e9dc;box-shadow:0 4px 0 #c8cebf;border-radius:50%;width:54px;height:46px;color:#48604a;font-size:18px;cursor:pointer;touch-action:none;user-select:none}.keys button:nth-child(2){background:#efbc63;box-shadow:0 4px 0 #cf9945}.keys button:active{transform:translateY(3px);box-shadow:none}.brand{text-align:center;font-size:10px;letter-spacing:3px;margin:18px 0 0;color:#849080}.panel h2{font-size:23px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button{border:1px solid #cad2c3;background:transparent;border-radius:30px;padding:9px 14px;color:#52664e;cursor:pointer}.tabs button.on{background:#365d47;color:white;border-color:#365d47}.notes{border-top:1px solid #d8ded0;padding-top:18px;line-height:1.9;font-size:14px;color:#667564}.notes strong{color:#304e3c}.legend{display:grid;grid-template-columns:66px 1fr;gap:8px;margin-top:22px;font-size:13px;line-height:1.7}.legend dt{font-weight:600}.legend dd{margin:0;color:#71806e}.small{font-size:12px;color:#81907b;line-height:1.8;margin-top:24px}.choices{display:flex;gap:8px;margin:17px 0 8px}.choice{font-size:62px;background:#f0eedc;border:3px solid transparent;border-radius:18px;width:98px;height:105px;display:grid;place-items:center}.verse{font-size:23px;letter-spacing:2px;font-weight:600;margin:12px 0}.poem-art{font-size:57px;line-height:1.2}.dots{display:flex;gap:7px}.dot{width:7px;height:7px;background:#d9ddc9;border-radius:50%}.dot.on{background:#63835a}.action{background:#e8eddb;border:3px solid transparent;padding:9px 13px;border-radius:12px;width:100%;font-size:15px}.feedback{font-size:18px;color:#4c754c;margin-top:12px}@media(max-width:760px){main{padding:26px 20px}h1{font-size:27px}.layout{grid-template-columns:1fr;gap:30px}.panel{max-width:440px;margin:auto}.device-zone{padding:26px}.intro{font-size:14px}}
</style>
<main><div class="eyebrow">AI PASSPORT / LEARNING LAB · 01</div><h1>小小屏幕，慢慢学会。</h1><p class="intro">为5岁孩子设计的三键学习体验。每次只做一件小事：听一个词，看一张图，再自己试一试。</p><div class="layout"><div class="device-zone"><div class="device"><div class="screen" aria-live="polite"><div class="status"><span>小智学堂</span><span id="status">♪ 50%　▰</span></div><div id="view" class="view"></div><div class="hint" id="hint"></div></div><div class="keys"><button data-key="up" aria-label="上一项，长按增大音量">▲</button><button data-key="ok" aria-label="确认，长按返回">●</button><button data-key="down" aria-label="下一项，长按减小音量">▼</button></div><div class="brand">FOLOTOY · AI PASSPORT</div></div></div><section class="panel"><div class="eyebrow">可操作交互原型</div><h2 id="sceneTitle"></h2><div class="tabs"><button data-scene="home">学习首页</button><button data-scene="word">英语卡片</button><button data-scene="quiz">听音找图</button></div><div class="notes" id="notes"></div><dl class="legend"><dt>短按上下</dt><dd>切换内容或选择答案</dd><dt>短按中间</dt><dd>确认选择或听发音</dd><dt>长按中间</dt><dd>返回上一层，保留学习位置</dd><dt>长按上下</dt><dd>上键增大音量，下键减小音量</dd></dl><p class="small">电脑也可用 ↑ ↓ 和 Enter 操作，Esc 返回。<br>浏览器语音仅用于模拟；实际设备使用本地标准音频。此原型不录音、不评价发音，不代表实机音质与性能。</p><button id="sound" style="border:0;background:transparent;color:#56724f;cursor:pointer;padding:0">语音模拟：开</button></section></div></main>
<script>
const words=[{en:'apple',zh:'苹果',art:'🍎'},{en:'banana',zh:'香蕉',art:'🍌'},{en:'cat',zh:'小猫',art:'🐱'},{en:'dog',zh:'小狗',art:'🐶'}];
let saved={};try{saved=JSON.parse(localStorage.getItem('learning-prototype')||'{}')}catch{}
let word=Number.isInteger(saved.word)?Math.max(0,Math.min(3,saved.word)):0;
let page='home',choice=0,round=0,answered=false,questionHeard=false,volume=50,sound=true,speechToken=0,phase='';
const view=document.querySelector('#view'),hint=document.querySelector('#hint');
const info={home:['今天学英语！','<strong>英语乐园，一个入口。</strong><br>先听词、看图，再找答案。单词位置保存在浏览器里；本原型不连接云端聊天。'],word:['看图，听到第一个词','<strong>图片先说话，文字做辅助。</strong><br>中间键听发音，听完留在原卡片。上下换词；最后一张之后进入听音找图。'],quiz:['听一听，找出它','<strong>先练听懂，再谈说得准。</strong><br>上下选择，中间确认。答错可以再试，答对再按中间继续；不会因误按跳走。']};
function persist(){try{localStorage.setItem('learning-prototype',JSON.stringify({word}))}catch{}}
function cancel(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();phase=''}
function speak(text,lang='zh-CN',after='轮到你啦'){cancel();if(!sound||!('speechSynthesis'in window)){phase=sound?'此浏览器无法朗读':(page==='quiz'?'语音已关闭 · 仅演示选择流程':'语音已关闭 · 中间键可模拟听读');render();return}const token=speechToken;phase='听一听…';render();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.75;u.volume=volume/100;u.onend=()=>{if(token===speechToken){phase=after;render()}};u.onerror=()=>{if(token===speechToken){phase='语音暂不可用 · 可继续操作';render()}};speechSynthesis.speak(u)}
function setPage(p){cancel();page=p;render()}
function render(){document.querySelector('#status').textContent=`♪ ${volume}%　▰`;document.querySelector('#sceneTitle').textContent=info[page][0];document.querySelector('#notes').innerHTML=info[page][1];document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('on',b.dataset.scene===page));
if(page==='home'){view.innerHTML=`<div class="sub">每天一点点，学会好多点</div><h2>今天学英语！</h2><div class="menu selected"><span>🍎</span>英语乐园</div><div class="sub">听一听 · 认一认 · 找一找</div><div class="sub">接着学：${words[word].en}</div>`;hint.textContent='中间进入'}
if(page==='word'){let w=words[word];view.innerHTML=`<div class="sub">英语乐园 · ${word+1} / ${words.length}</div><div class="art">${w.art}</div><div class="word">${w.en}</div><div class="zh">${w.zh}</div><div class="pill">${phase||'按中间，听一听'}</div>`;hint.textContent=word===3?'下一项：听音找图 · 长按中间返回':'上下换词 · 中间听 · 长按返回'}
if(page==='quiz'){let target=round%4,other=(target+1)%4,options=round%2?[other,target]:[target,other];view.innerHTML=`<div class="sub">听音找图 · ${round+1} / 4</div><h2>${answered?'找对啦！':'哪个是它？'}</h2><div class="choices">${options.map((n,i)=>`<div class="choice ${choice===i?'selected':''}">${words[n].art}</div>`).join('')}</div><div class="pill">${phase||(answered?'中间键，继续':'中间键，听题目')}</div>`;hint.textContent=answered?'中间继续 · 长按返回':'上下选图 · 中间确认 · 长按返回'}persist()}
function act(key,long=false){if(long){if(key==='ok'){if(page==='home')return;setPage(page==='quiz'?'word':'home')}else{volume=Math.max(0,Math.min(100,volume+(key==='up'?10:-10)));render()}return}
if(page==='home'){if(key==='ok')setPage('word');return}
if(page==='word'){if(key==='ok'){speak(words[word].en,'en-GB');return}cancel();if(key==='down'&&word===3){round=0;choice=0;answered=false;questionHeard=true;setPage('quiz');speak('Find the '+words[0].en,'en-GB','上下选图，中间确认')}else{word=(word+(key==='up'?-1:1)+4)%4;render()}return}
if(page==='quiz'){if(key!=='ok'){if(!answered)choice=1-choice;phase=answered?'找到了！中间键继续':'中间键确认';render();return}if(answered){round++;if(round===4){word=0;setPage('word');phase='今天找到了四个词！';render();return}choice=0;answered=false;questionHeard=true;speak('Find the '+words[round].en,'en-GB','上下选图，中间确认');return}if(!questionHeard){questionHeard=true;speak('Find the '+words[round].en,'en-GB','上下选图，中间确认');return}cancel();answered=choice===round%2;phase=answered?'找到了！中间键继续':'再试一次，中间确认';render();if(!answered)speak('Find the '+words[round].en,'en-GB','再试一次，中间确认');return}}

document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{if(b.dataset.scene==='quiz'){round=0;choice=0;answered=false;questionHeard=false}setPage(b.dataset.scene)});
document.querySelectorAll('[data-key]').forEach(b=>{let timer,held=false;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held=false;timer=setTimeout(()=>{held=true;act(b.dataset.key,true)},650)};b.onpointerup=()=>{clearTimeout(timer);if(!held)act(b.dataset.key)};b.onpointercancel=()=>clearTimeout(timer);b.onkeydown=e=>{if(e.key===' '){e.preventDefault();act(b.dataset.key)}}});
document.addEventListener('keydown',e=>{if(e.repeat)return;let k={ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'ok'}[e.key];if(k){e.preventDefault();act(k,e.key==='Escape')}});
document.querySelector('#sound').onclick=()=>{sound=!sound;cancel();document.querySelector('#sound').textContent='语音模拟：'+(sound?'开':'关');render()};render();
</script></html>
